# Continuous integration: build and test the backend and the frontend on every push and pull request.
# The two jobs run in parallel.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # A throwaway Postgres + pgvector database, same image as docker-compose.yml.
    # The tests need it because Flyway runs V1__init.sql when the app starts.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: earningslens
          POSTGRES_USER: earningslens
          POSTGRES_PASSWORD: earningslens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U earningslens -d earningslens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Settings the app reads. No real OpenAI key is needed: the tests do not call OpenAI.
    env:
      DB_URL: jdbc:postgresql://localhost:5432/earningslens
      DB_USER: earningslens
      DB_PASSWORD: earningslens

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B verify

      # E7.2: print line coverage per package from the JaCoCo report written during verify.
      # Report only (no threshold). Columns in jacoco.csv: 2 = package, 8 = lines missed, 9 = lines covered.
      - name: Line coverage (JaCoCo)
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ ! -f "$csv" ]; then echo "No JaCoCo report found"; exit 0; fi
          printf "%-35s %8s %8s\n" package lines covered
          awk -F, 'NR > 1 { missed[$2] += $8; covered[$2] += $9 }
            END {
              for (p in covered) {
                total = missed[p] + covered[p]
                if (total > 0) printf "%-35s %8d %7.1f%%\n", p, total, 100 * covered[p] / total
              }
            }' "$csv" | sort

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Same major Node version as the dev machine (24). Angular 22 needs ^22.22.3 or ^24.15.0.
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says (no version drift).
      - name: Install packages
        run: npm ci

      - name: Build (production)
        run: npx ng build

      # Vitest in jsdom: headless, no browser needed.
      - name: Unit tests
        run: npx ng test --watch=false
