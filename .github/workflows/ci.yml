# Continuous integration: build and test the backend on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # A throwaway Postgres + pgvector database, same image as docker-compose.yml.
    # The tests need it because Flyway runs V1__init.sql when the app starts.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: earningslens
          POSTGRES_USER: earningslens
          POSTGRES_PASSWORD: earningslens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U earningslens -d earningslens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Settings the app reads. No real OpenAI key is needed: the tests do not call OpenAI.
    env:
      DB_URL: jdbc:postgresql://localhost:5432/earningslens
      DB_USER: earningslens
      DB_PASSWORD: earningslens

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B verify
