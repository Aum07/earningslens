# Profile "prod": Azure deployment.
# No defaults for secrets here: if a variable is missing, the app fails to start
# instead of silently using a local value. Azure supplies these as env vars (no .env file).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

earningslens:
  sec:
    user-agent: ${SEC_USER_AGENT}
  api:
    cors-allowed-origins: ${FRONTEND_ORIGIN}   # the Static Web Apps URL (Phase 8)

server:
  # Azure Container Apps sits behind a proxy: trust its X-Forwarded-For so the rate limit sees the real client IP.
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO
