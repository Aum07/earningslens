# Default profile: local development.
# Values like ${DB_URL:...} are read from environment variables or the .env file;
# the part after ":" is the default for the local Docker database.

spring:
  application:
    name: earningslens

  # Load secrets from the .env file in the project root (gitignored).
  # "optional:" means the app still starts if the file is missing.
  # Two paths because the working folder is either backend/ or the project root.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/earningslens}
    username: ${DB_USER:earningslens}
    password: ${DB_PASSWORD:earningslens}

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches.
    open-in-view: false

  ai:
    openai:
      # Real key comes from OPENAI_API_KEY (never committed).
      # The placeholder only lets the app start before a key is set.
      api-key: ${OPENAI_API_KEY:not-set}
      # Our EmbeddingService does its own backoff (E1.7), so the client must not retry too,
      # otherwise one failure could turn into 3 x 5 requests.
      max-retries: 0

earningslens:
  llm:
    chat-model: gpt-4o-mini
    embedding-model: text-embedding-3-small
    embedding-dimensions: 1536
    temperature: 0.0
    max-output-tokens: 700
  retrieval:
    k: 16                 # tuned on dev in E3.6 (spec default 8); see DECISIONS.md "k sweep on dev"
    k-per-period: 5       # tuned on dev in E3.6 (spec default 3); up to 4 x 5 = 20 chunks per question
    max-periods: 4
    vector-candidates: 30
    keyword-candidates: 30
    rrf-k: 60
    min-similarity: 0.531 # chosen on dev in E3.7: blocks no answerable dev question (DECISIONS.md)
    mode: C               # ablation config for the API (spec 11.4). Was D until 2026-11-04: on the test split D's
                          # threshold wrongly declined 4 of 45 answerable questions (C: 1); see docs/error-analysis.md
  api:
    latest-eval-report: ../eval/reports/latest.json   # written by the Phase 5 eval run (spec 11.5)
    cors-allowed-origins: http://localhost:4200        # Angular dev server; prod sets FRONTEND_ORIGIN
  rate-limit:
    requests-per-minute-per-ip: 10
    daily-chat-cap: 300
  sec:
    user-agent: ${SEC_USER_AGENT:EarningsLens dev contact@example.com}
    min-delay-millis: 250   # 4 requests per second, well under the SEC limit of 10
  ingest:
    # Paths are relative to the working folder, which is backend/ when you run
    # ./mvnw spring-boot:run or the tests.
    manifest-path: ../corpus/manifest.yaml
    raw-dir: ../corpus/raw
  chunking:
    target-tokens: 600   # spec 7.2 step 4
    overlap-tokens: 100
    max-tokens: 900
  embedding:
    batch-size: 64              # spec 7.2 step 5
    max-retries: 5
    initial-backoff-millis: 1000  # 1s, 2s, 4s, 8s, 16s
    max-backoff-millis: 30000

# Error bodies are ProblemDetail (GlobalExceptionHandler); never show stack traces or internal messages.
server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
