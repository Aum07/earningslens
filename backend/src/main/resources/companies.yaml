# Ticker and alias map for the deterministic QueryParser (spec section 8).
# Match aliases case-insensitively on word boundaries, so "Meta" does not match "metadata".
# fiscal-year-end-month lets PeriodResolver map calendar references to fiscal periods
# (MSFT: July-September 2026 is FY2027 Q1).

companies:
  - ticker: MSFT
    name: Microsoft Corporation
    cik: "0000789019"
    fiscal-year-end-month: 6
    aliases:
      - Microsoft
      - Microsoft Corp
      - Microsoft Corporation
      - MSFT

  - ticker: GOOGL
    name: Alphabet Inc.
    cik: "0001652044"
    fiscal-year-end-month: 12
    aliases:
      - Alphabet
      - Alphabet Inc
      - Google
      - GOOGL
      - GOOG

  - ticker: META
    name: Meta Platforms, Inc.
    cik: "0001326801"
    fiscal-year-end-month: 12
    aliases:
      - Meta
      - Meta Platforms
      - Facebook
      - META
