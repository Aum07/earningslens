# Profile "eval": run from the command line to execute the evaluation harness.
# No web server; the app runs the eval job, writes reports and exits.
spring:
  main:
    web-application-type: none

# Eval job settings (EvalProperties). Usually given on the command line, for example:
#   --eval.config=A,B,C --eval.split=dev --eval.confirm=true
# Without --eval.confirm=true the job only prints the cost estimate and sends nothing to OpenAI.
eval:
  task: retrieval            # retrieval (E3.6), judge-sample (E5.1), label-prep, judge-agreement (E5.2), full (E5.3); all dev only
  config: A,B,C
  split: dev
  confirm: false
  label: ""                  # optional report-name suffix while tuning, for example k10
  sweep: ""                  # optional, for example 8x3,12x4,16x5: one report per k x k-per-period setting
  dataset-path: ../eval/dataset.jsonl
  reports-dir: ../eval/reports
  embedding-price-per-million-tokens: 0.02   # text-embedding-3-small, OpenAI list price (checked 2026-11-02)
  chat-input-price-per-million-tokens: 0.15  # gpt-4o-mini input, OpenAI list price (checked 2026-11-04)
  chat-output-price-per-million-tokens: 0.60 # gpt-4o-mini output
  human-labels-path: ../eval/human-labels.jsonl          # E5.2: filled in by hand
  label-answers-path: ../eval/human-labels-answers.json  # E5.2: answers saved by label-prep
  label-review-path: ../eval/human-labels-review.md      # E5.2: sheet to label from
  label-count: 30                                         # spec 11.3
  final-test-run: false      # E5.4 only: true (with task full and A,B,C,D) opens the test split, once
  judge-agreement-report: ../eval/reports/2026-11-04-judge-agreement-dev-v2.json   # quoted in latest.json
  judge:                     # LLM judge (JudgeProperties, E5.1); rubric and prompt in eval/judge-rubric.md
    model: gpt-4.1           # chosen 2026-11-04: stronger than, and different from, the answer model
    temperature: 0.0
    max-output-tokens: 2000
    max-attempts: 2          # one retry when the reply fails validation
    rubric-path: ../eval/judge-rubric.md
    input-price-per-million-tokens: 2.00   # gpt-4.1 list price (checked 2026-11-04)
    output-price-per-million-tokens: 8.00
    sample-ids: q001,q015,q021             # judge-sample: single_fact, multi_quarter, qualitative (dev)
