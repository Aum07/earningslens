<div class="row">
  <span class="number cite" aria-hidden="true">{{ citation().marker }}</span>
  <div class="text">
    <p class="title">
      {{ docType() }}
      @if (highlighted()) {
        <span class="selected-tag">Selected</span>
      }
    </p>
    <p class="meta">{{ meta() }}</p>
  </div>
  <button type="button" class="view" aria-haspopup="dialog" [attr.aria-label]="'View passage of source ' + citation().marker" (click)="viewPassage.emit()">
    View passage
  </button>
</div>
